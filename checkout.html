<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nostra - Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <h1>Nostra</h1>

        <div class="navbar-links">

            <p class="navbar-link">
                <a href="index.html">Home</a>
            </p>

            <p class="navbar-link">
                <a href="collection.html">Collections</a>
            </p>

            <p class="navbar-link">
                <a href="contact.html">Contact</a>
            </p>

            <p class="navbar-link">
                <a href="cart.html">Cart</a>
            </p>

        </div>

    </nav>


    <div class="checkout-section">

        <h1>Checkout</h1>

        <input type="text"
               id="customerName"
               placeholder="Full Name">

        <input type="email"
               id="customerEmail"
               placeholder="Email">

        <input type="number"
               id="customerPhone"
               placeholder="Phone Number">

        <textarea id="customerAddress"
                  placeholder="Address"></textarea>

        <input type="text"
               id="customerCity"
               placeholder="City">

        <input type="number"
               id="customerPincode"
               placeholder="Pincode">

        <button onclick="placeOrder()">
            Place Order
        </button>

    </div>


    <script src="checkout.js"></script>

</body>

</html>
